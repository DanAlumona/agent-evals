name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Prints the v1-vs-v2 readout in the CI log. Add "-- --gate" to fail the
      # build unless the decision is SHIP.
      - run: npm run eval
